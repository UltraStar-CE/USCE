ABOUT_OVERVIEW=UltraStar Deluxe on ilmainen avoimen lähdekoodin karaokepeli PC:lle. Pelikokemus on samanlainen kuin Sonyn kaupallisessa SingStar™-tuotteessa, jota saa vain Playstation®-konsolille. SingStar™:ista poiketen UltraStar Deluxella voit kuitenkin luoda omia kappaleita ja laulaa niitä PC:llä.\nJulkaisemalla lähdekoodin olemme mahdollistaneet pelin muokkaamisen täysin sydämesi halujen ja tarpeidesi mukaan.\nErityisesti saat muokata tuotetta haluamallasi tavalla.\n\nLuo omia teemoja tai lataa yhteisön sisältöä, kuten lisäosia, ilmaisia kappaleita tai koodikorjauksia lisäominaisuuksia varten.\nParty-moodissa jopa kaksitoista laulajaa voi laulaa lempimusiikkisi tahtiin ja kerätä pisteitä äänen korkeuden ja laulun rytmin perusteella.


