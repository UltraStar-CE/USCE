ABOUT_OVERVIEW=UltraStar Deluxe er et gratis karaokespill med åpen kildekode for PC-en din. Spillopplevelsen ligner på det kommersielle produktet SingStar™ fra Sony Computer Entertainment, som kun er tilgjengelig for Playstation®. I motsetning til SingStar™ lar UltraStar Deluxe deg lage dine egne sanger og synge dem på PC-en.\nVed å publisere kildekoden har vi gjort det mulig for deg å tilpasse spillet fullstendig etter eget hjerte, ønsker og behov.\nSpesielt står du fritt til å endre produktet som du vil.\n\nLag dine egne temaer eller last ned innhold fra fellesskapet, som plugins, gratis sanger eller kodeoppdateringer for utvidede funksjoner.\nI partymodus kan opptil tolv spillere synge med på favorittmusikken din og score poeng ut fra stemmens tonehøyde og rytmen i sangen.
