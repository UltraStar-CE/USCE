ABOUT_OVERVIEW=Το UltraStar Deluxe είναι ένα δωρεάν παιχνίδι καραόκε ανοιχτού κώδικα για τον υπολογιστή σας. Η εμπειρία παιχνιδιού μοιάζει με αυτή του εμπορικού προϊόντος SingStar™ της Sony Computer Entertainment, που κυκλοφορεί αποκλειστικά για το Playstation®. Σε αντίθεση με το SingStar™, όμως, το UltraStar Deluxe επιτρέπει στους χρήστες να δημιουργούν τα δικά τους τραγούδια και να τα τραγουδούν στον υπολογιστή τους.\nΜε τη δημοσίευση του πηγαίου κώδικα, σας δίνουμε τη δυνατότητα να προσαρμόσετε το παιχνίδι πλήρως στις επιθυμίες και τις ανάγκες σας.\nΣυγκεκριμένα, επιτρέπεται να τροποποιήσετε το προϊόν όπως θέλετε.\n\nΔημιουργήστε τα δικά σας θέματα ή κατεβάστε περιεχόμενο από την κοινότητα, όπως πρόσθετα, δωρεάν τραγούδια ή patches κώδικα για επιπλέον λειτουργίες.\nΣε λειτουργία πάρτυ επιτρέπει σε έως δώδεκα παίχτες να τραγουδήσουν μαζί τα αγαπημένα σας τραγούδια και να κερδίσουν πόντους, ανάλογα με το ύψος της φωνής και τον ρυθμό του τραγουδιού.


