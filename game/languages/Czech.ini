ABOUT_OVERVIEW=UltraStar Deluxe je svobodná karaoke hra s otevřeným kódem pro tvůj počítač. Hratelnost se podobá komerčnímu produktu SingStar™ od Sony Computer Entertainment, který je dostupný výhradně na Playstation®. Na rozdíl od SingStar™ však UltraStar Deluxe umožňuje vytvářet vlastní skladby a zpívat je na počítači.\nZveřejněním zdrojového kódu jsme ti umožnili upravit hru zcela podle tvých představ a potřeb.\nZejména smíš produkt libovolně upravovat.\n\nVytvářej vlastní témata nebo stahuj obsah od komunity, například pluginy, volné skladby či záplaty kódu s rozšířenými funkcemi.\nV párty módu umožňuje zpívat s oblíbenou hudbou až dvanácti hráčům a získávat body podle výšky hlasu a rytmu zpěvu.


