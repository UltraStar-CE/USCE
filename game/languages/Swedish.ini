ABOUT_OVERVIEW=UltraStar Deluxe är ett gratis karaokespel med öppen källkod för din dator. Spelupplevelsen liknar den i den kommersiella produkten SingStar™ från Sony Computer Entertainment, som uteslutande finns till Playstation®. Till skillnad från SingStar™ låter UltraStar Deluxe dock användarna skapa egna låtar och sjunga dem på datorn.\nGenom att publicera källkoden har vi gjort det möjligt för dig att anpassa spelet helt efter eget hjärta, önskemål och behov.\nFramför allt får du ändra produkten som du vill.\n\nSkapa egna teman eller ladda ner innehåll från communityn, som insticksprogram, gratis låtar eller kodpatchar för utökade funktioner.\nI partyläge kan upp till tolv spelare sjunga med till din favoritmusik för att samla poäng, beroende på rösttonhöjd och sångrytm.


