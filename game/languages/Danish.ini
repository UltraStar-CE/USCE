ABOUT_OVERVIEW=UltraStar Deluxe er et gratis karaokespil med åben kildekode til din pc. Spiloplevelsen minder om det kommercielle produkt SingStar™ fra Sony Computer Entertainment, som udelukkende fås til Playstation®. I modsætning til SingStar™ lader UltraStar Deluxe dog brugerne lave deres egne sange og synge dem på pc'en.\nVed at udgive kildekoden har vi gjort det muligt for dig at tilpasse spillet fuldstændigt efter dit hjertes lyst og dine helt egne behov.\nSærligt er du velkommen til at ændre produktet, som du vil.\n\nLav dine egne temaer eller download indhold fra fællesskabet, såsom plugins, gratis sange eller kodepatches med udvidede funktioner.\nI festmodus kan op til tolv spillere synge med på din yndlingsmusik for at score point ud fra stemmens tonehøjde og sangens rytme.
