ABOUT_OVERVIEW=UltraStar Deluxe és un joc de karaoke gratuït i de codi obert per al teu PC. L'experiència de joc és semblant a la del producte comercial SingStar™ de Sony Computer Entertainment, disponible exclusivament per a la Playstation®. A diferència de SingStar™, però, UltraStar Deluxe permet als usuaris crear les seves pròpies cançons i cantar-les al PC.\nAl publicar el codi font, et permetem personalitzar el joc completament al teu gust, desitjos i necessitats particulars.\nEn especial, pots modificar el producte com vulguis.\n\nCrea els teus propis temes o descarrega contingut de la comunitat, com connectors, cançons lliures o pegats de codi amb funcions ampliades.\nEn mode festa permet cantar fins a dotze jugadors alhora amb la teva música preferida per aconseguir punts, segons l'afinació de la veu i el ritme del cant.
