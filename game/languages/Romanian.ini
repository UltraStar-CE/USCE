ABOUT_USDX_CREDITS=Credite
ABOUT_OVERVIEW=UltraStar Deluxe este un joc karaoke gratuit și open-source pentru PC. Experiența de joc este similară cu cea a produsului comercial SingStar™ de la Sony Computer Entertainment, disponibil exclusiv pe Playstation®. Spre deosebire de SingStar™, UltraStar Deluxe le permite utilizatorilor să-și creeze propriile melodii și să le cânte pe PC.\nPublicând codul sursă, ți-am oferit posibilitatea de a personaliza jocul complet după pofta inimii și nevoile tale.\nÎn special, ai voie să modifici produsul cum dorești.\n\nCreează-ți propriile teme sau descarcă conținut de la comunitate, precum plugin-uri, melodii gratuite sau patch-uri de cod pentru funcții extinse.\nÎn modul party, permite până la doisprezece jucători să cânte pe muzica ta preferată pentru a strânge puncte, în funcție de înălțimea vocii și de ritmul cântării.


