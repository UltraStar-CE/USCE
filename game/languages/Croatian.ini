ABOUT_OVERVIEW=UltraStar Deluxe je besplatna karaoke igra otvorenog koda za tvoje računalo. Doživljaj igre sličan je komercijalnom proizvodu SingStar™ tvrtke Sony Computer Entertainment, dostupnom isključivo na Playstation®. Za razliku od SingStar™, UltraStar Deluxe omogućuje korisnicima da naprave vlastite pjesme i pjevaju ih na računalu.\nObjavom izvornog koda omogućili smo ti da igru potpuno prilagodiš svojim željama i potrebama.\nPosebno, slobodno možeš mijenjati proizvod kako god želiš.\n\nNapravi vlastite teme ili preuzmi sadržaj zajednice, poput pluginova, besplatnih pjesama ili code patcheva za dodatne funkcije.\nU party načinu do dvanaest igrača može pjevati uz tvoju omiljenu glazbu i skupljati bodove, ovisno o visini glasa i ritmu pjevanja.
