ABOUT_OVERVIEW=UltraStar Deluxeは、PC向けの無料のオープンソース・カラオケゲームです。遊び心地は、Sony Computer Entertainmentの市販製品SingStar™（Playstation®専用）に似ています。ただしSingStar™と違い、UltraStar Deluxeでは自分で曲を作ってPCで歌うことができます。\nソースコードを公開しているので、ゲームを心ゆくまで、好みや必要に合わせて自由にカスタマイズできます。\n特に、好きなように改造して構いません。\n\n自分だけのテーマを作ったり、プラグイン、フリー曲、拡張機能用のコードパッチなど、コミュニティのコンテンツをダウンロードしたりしましょう。\nパーティー・モードでは最大12人が好きな曲に合わせて歌い、声の高さと歌のリズムに応じてポイントを競えます。
