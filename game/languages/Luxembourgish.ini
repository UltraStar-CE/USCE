ABOUT_OVERVIEW=UltraStar Deluxe ass e fräit Open-Source-Karaoke-Spill fir Äre PC. D'Spillerfahrung ass ähnlech wéi beim kommerziellt Produkt SingStar™ vu Sony Computer Entertainment, dat exklusiv fir d'Playstation® verfügbar ass. Am Géigesaz zu SingStar™ erlaabt UltraStar Deluxe et de Benotzer awer, hir eege Lidder ze erstellen an op hirem PC ze sangen.\nDurch d'Verëffentlechung vum Quellcode hu mir Iech et méiglech gemaach, d'Spill komplett no Äre Wënsch a Bedierfnesser unzepassen.\nVirun allem däerft Dir d'Produkt änneren, wéi Dir wëllt.\n\nErstellt Är eege Designs oder luet Inhalter vun der Communautéit erof, wéi Plugins, gratis Lidder oder Code-Patches fir erweidert Funktiounen.\nAm Party-Modus kënnen bis zu zwielef Spiller bei Ärer Liblingsmusek matsangen an Punkte sammelen, jee no Tounhéicht vun der Stëmm a Rhythmus vum Gesang.


