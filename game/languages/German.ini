SUB_090 = Endlosmodus
ENT_091 = Aktiviere den Endlosmodus in der Konfiguration und starte dann wie gewohnt einen Song. Für eine Wiedergabe mit Text wähle 0 lokale Spieler und weise keine Smartphones zu.
ENT_092 = Playlists mit fester Reihenfolge werden in dieser Reihenfolge abgespielt. Andere Playlists und die gefilterte Auswahl werden zufällig abgespielt.
ENT_093 = Am Ende stoppt die Wiedergabe, sofern keine Wiederholung aktiviert ist. Ergebnisse und Bestenlisten lassen sich kurz anzeigen oder überspringen.
