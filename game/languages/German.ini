[ID_082]
SUB_040 = Anzeige
ENT_041 = Unter Songanzeige wählst du, ob Lyrics und Fortschritt angezeigt werden. Nur Fortschritt funktioniert auch ohne Spieler. Bei Nichts bleibt nur der Hintergrund oder das Video zu sehen.
ENT_042 = Unter Singanzeige wählst du Vollständig, Noten und Spielerinfo, Nur Noten, Nur Spielerinfo oder Nichts. Nur die vollständige Anzeige zeigt Wertungseinblendungen und Singeffekte. Zur Spielerinfo gehören Name, Avatar und Punktzahl. Singen und Punktewertung laufen in allen Einstellungen weiter.
Title = Konfiguration
Description = Stelle Singanzeige und Wiedergabe für Einzelwiedergabe und Endlosmodus getrennt ein.
SUB_010 = Spieler
ENT_011 = Wähle deine Spieler wie gewohnt in der Spielerauswahl. Bei 0 Spielern werden die Lyrics aller Stimmen und der Hintergrund ohne Mikrofone oder Wertung angezeigt.
ENT_012 = Du kannst auch einen einzelnen Song mit 0 Spielern abspielen.
SUB_020 = Auswahl
ENT_021 = Aktiviere den Endlosmodus hier, kehre zur Songauswahl zurück und starte wie gewohnt einen Song. Die aktuelle Playlist oder der aktuelle Filter gibt vor, welche Songs folgen.
ENT_022 = Sortierte Playlists werden der Reihe nach abgespielt. Andere Auswahlen werden einmal in zufälliger Reihenfolge gespielt. Am Ende stoppt die Wiedergabe, sofern Wiederholen aus ist. Nicht lesbare Songs werden übersprungen und gemeldet.
SUB_030 = Ergebnisse
ENT_031 = Wähle für Auswertung und Bestenliste einzeln, ob sie auf Eingabe warten, übersprungen oder für eine feste Zeit angezeigt werden. Bei 0 Spielern werden beide übersprungen. Beim Umschalten des Endlosmodus speichert das Spiel die aktuellen Einstellungen und lädt die des anderen Modus.
SEC_001 = Steuerung während der Wiedergabe
SPACE = Wiedergabe und Wartezeit auf dem Ergebnisbildschirm pausieren oder fortsetzen
P = Wiedergabe und Wartezeit auf dem Ergebnisbildschirm pausieren oder fortsetzen
LEFTRIGHT = Vorheriger/nächster Song im Endlosmodus
MOUSE = Zeiger durch Bewegung einblenden. Auf den Fortschrittsbalken klicken, um zu springen. Dabei werden keine Punkte gespeichert.
RETURN = Aktuellen Ergebnisbildschirm verlassen
ESC = Wiedergabe beenden und zur Songauswahl zurückkehren

