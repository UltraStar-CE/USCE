Title = Spielernamen
Description = Wähle Spieler, Namen, Avatare, Farben, Schwierigkeitsgrade und Stimmen aus.
SUB_070 = Namensvorschläge
ENT_071 = Das erste eingegebene Zeichen ersetzt den aktuellen Namen. Weitere Zeichen werden angehängt. Mit der Rücktaste kannst du den bestehenden Namen bearbeiten.
ENT_072 = Ein blass angezeigter Namensrest ist ein Vorschlag aus den zuletzt verwendeten Namen. Ein Feldwechsel oder Enter übernimmt den Vorschlag. Mit einem weiteren Enter geht es weiter.
ENT_073 = Esc verwirft zuerst den Vorschlag. Ein weiteres Esc geht zurück. Beim Weitergehen werden die Namen der aktiven Spieler gespeichert.
SUB_090 = Mikrofonpegel
ENT_091 = Je lauter das Mikrofonsignal, desto heller wird der Rahmen des Avatars. Welche Einstellung gerade ausgewählt ist, siehst du davon unabhängig.
ENT_092 = Bei regulären Songs und Medleys zählen unter „Lokal“ nur die hier ausgewählten Spieler. Zugewiesene Smartphone-Mikrofone kommen automatisch hinzu, auch bei 0 lokalen Spielern.
SUB_080 = Stimmen
ENT_081 = Bei Songs mit mehreren Stimmen kannst du im ausgewählten Profil eine Stimme wählen. Mehrere Spieler können dieselbe Stimme singen. In der Songauswahl klickst du auf eine Stimme, um ihre Zuweisung zu ändern.
