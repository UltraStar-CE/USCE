[ID_017]
Title = Songmenü
Description = Hier findest du die verfügbaren Aktionen für diesen Song oder diese Playlist.
SUB_010 = Song
ENT_011 = ♫ Singen startet den ausgewählten Song mit den aktuellen Einstellungen.
ENT_012 = ♫ Unter Spieler ändern bearbeitest du die Namen oder weist Mikrofone zu.
ENT_013 = ♫ Song hinzufügen übernimmt den Song in eine neue oder bestehende Playlist.
ENT_014 = ♫ Bearbeiten öffnet den Songeditor für Timing, Noten und Tags.
ENT_015 = ♫ Abbrechen führt dich zurück zum Songmenü.
