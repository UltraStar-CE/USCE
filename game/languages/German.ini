CTRL_2 = Text und Noten in die nächsten 2 bis 6 Zeilen einfügen. Die Ziffer wählt die Zeilenanzahl.
CTRL_SHIFT_2 = Text in die nächsten 2 bis 6 Zeilen einfügen. Die Ziffer wählt die Zeilenanzahl.
CTRL_ALT_2 = Noten in die nächsten 2 bis 6 Zeilen einfügen. Die Ziffer wählt die Zeilenanzahl.
CTRL_SHIFT_ALT_2 = Text und Noten in die nächsten 2 bis 6 Zeilen einfügen und je Zeile die kürzere Länge übernehmen. Die Ziffer wählt die Zeilenanzahl.
