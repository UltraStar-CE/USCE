[ID_016]
Title = Songsuche
Description = Suche nach Titel, Interpret, Sprache, Edition, Genre, Jahr, Autor, Alter oder Ordner.
SUB_005 = Filter kombinieren
ENT_006 = Jede Zeile schränkt die Auswahl weiter ein. Drücke unter der letzten ausgefüllten Zeile auf den Pfeil nach unten oder Einfg, um eine Zeile anzulegen. Enter oder Esc schließt die Suche und behält die Filter, auch ohne Treffer.
ENT_007 = Bei Sprache, Edition, Genre, Jahr und Tags trennst du Alternativen mit Komma oder Semikolon. Bei Jahren gehen auch Leerzeichen, etwa 1987 1988,1989;2000. Satzzeichen in Titeln und Interpreten werden als Teil des Namens gesucht.
ENT_008 = Über das Stecknadelsymbol kannst du die aktuellen Filter unter einem Namen speichern oder einen gespeicherten Filter laden. Vorschläge zeigen die Anzahl passender Songs an. Ein Klick übernimmt den Vorschlag und fügt ein Komma für eine weitere Auswahl ein.
ENT_009 = Das x leert alle Filter. Eine bestehende Sperre bleibt aktiv. Mit dem Mausrad scrollst du durch die Zeilen.
SUB_010 = Altersfilter
ENT_011 = Wähle „Alter“ und gib 12, <12, <=12, >12 oder >=12 ein. Eine Suche mit Zahlen schließt Songs ohne Altersfreigabe aus. Mit ? findest du diese Songs.
ENT_012 = Unter Einstellungen > Spiel > Land für Altersfreigaben wählst du das Land. Ein passender Landeswert hat Vorrang vor der Freigabe ohne Länderkürzel. Die Standardeinstellung verwendet nur den Wert ohne Kürzel.
ENT_013 = Mit DE:<=14 oder PEGI:<=12 wählst du für eine Suche ein Land oder eine Freigabestelle. Die Altersfreigaben stehen in deinen Songdateien.
SUB_020 = Aktuelle Auswahl sperren
ENT_021 = Filtere die gewünschten Songs, wähle „Sperren“ und gib zur Bestätigung zweimal ein Passwort ein.
ENT_022 = Neue Suchen und Playlists bleiben auf diese Songs beschränkt. Einstellungen, Editor und Beenden erfordern das Passwort.
ENT_023 = Wähle „Entsperren“, um wieder alle geladenen Songs anzuzeigen. Beim Beenden des Spiels endet die Sperre. Deine Songdateien bleiben unverändert.
SUB_030 = Markierte Songs
ENT_031 = Wähle „Ja“ für zur Korrektur markierte Songs oder „Nein“ für unmarkierte Songs. In der Songauswahl änderst du die Markierung mit Einfg. Markierungen bleiben lokal.
SUB_040 = Ordnerfilter
ENT_041 = Kids findet jeden Ordner mit dem Namen Kids samt Unterordnern. Denglish/Kids sucht diese Ordnerfolge. /Denglish/Kids beginnt in einem eingerichteten Songordner. Kommas oder Semikolons trennen Alternativen.
ENT_042 = Unter Einstellungen > Spiel stellst du Ordnerfilter und Ordneranzeige getrennt ein. Beim Öffnen eines Ordners wird nach seinem Pfad gefiltert und eine flache Liste angezeigt. Esc entfernt den Ordnerfilter und behält die übrigen Filter.
