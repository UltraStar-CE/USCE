ABOUT_OVERVIEW=Az UltraStar Deluxe egy ingyenes, nyílt forráskódú karaokejáték számítógépre. A játékélmény hasonló a Sony Computer Entertainment kereskedelmi termékéhez, a SingStar™-hoz, amely kizárólag Playstation®-re érhető el. A SingStar™-ral ellentétben azonban az UltraStar Deluxe lehetővé teszi, hogy a felhasználók saját dalokat készítsenek, és azokat a számítógépükön énekeljék.\nA forráskód közzétételével lehetővé tettük, hogy a játékot teljesen a saját ízlésed, vágyaid és igényeid szerint alakítsd.\nKülönösen is szabadon módosíthatod a terméket, ahogy csak szeretnéd.\n\nKészíts saját témákat, vagy tölts le tartalmakat a közösségtől, például bővítményeket, ingyenes dalokat vagy kódjavításokat további funkciókhoz.\nBuli módban akár tizenkét játékos is együtt énekelhet a kedvenc zenéire, és pontokat szerezhet a hang magassága és az éneklés ritmusa alapján.


