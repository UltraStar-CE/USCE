ABOUT_OVERVIEW=UltraStar Deluxe zure PCrako karaoke joko libre eta kode irekikoa da. Jokatzeko modua Sony Computer Entertainment-en SingStar™ produktu komertzialaren antzekoa da, Playstation®-erako soilik eskuragarri dagoena. SingStar™-ek ez bezala, ordea, UltraStar Deluxe-k erabiltzaileei beren abestiak sortzeko eta PCan abesteko aukera ematen die.\nIturburu-kodea argitaratuz, jokoa zure gustu, desio eta behar zehatzetara guztiz egokitzeko aukera eman dizugu.\nBatez ere, produktua nahi duzun moduan aldatzeko baimena duzu.\n\nSortu zure gaiak edo deskargatu komunitatearen edukia, hala nola pluginak, abesti libreak edo kode-adabakiak funtzio gehigarrietarako.\nTaldeko moduan, hamabi jokalarik arte abes dezakete zure musika gogokoenarekin batera, puntuak lortzeko, ahotsaren tonuaren eta abesteko erritmoaren arabera.


