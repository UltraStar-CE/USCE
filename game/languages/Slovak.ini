ABOUT_OVERVIEW=UltraStar Deluxe je bezplatná open-source karaoke hra pre váš počítač. Herný zážitok je podobný komerčnému produktu SingStar™ od Sony Computer Entertainment, ktorý je dostupný výlučne na Playstation®. Na rozdiel od SingStar™ však UltraStar Deluxe umožňuje používateľom vytvárať si vlastné skladby a spievať ich na počítači.\nZverejnením zdrojového kódu sme vám umožnili prispôsobiť hru úplne podľa vašich predstáv a potrieb.\nHru môžete najmä ľubovoľne upravovať.\n\nVytvárajte si vlastné témy alebo sťahujte obsah od komunity, napríklad pluginy, voľne dostupné skladby či záplaty kódu s rozšírenými funkciami.\nV party režime môže spolu spievať k vašej obľúbenej hudbe až dvanásť hráčov a získavať body podľa výšky hlasu a rytmu spevu.


