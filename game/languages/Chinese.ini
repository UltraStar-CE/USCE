ABOUT_OVERVIEW=UltraStar Deluxe 是一款免费开源的 PC 卡拉OK游戏。游戏体验类似于索尼电脑娱乐的商业产品 SingStar™，后者仅限于 Playstation® 平台。不过，与 SingStar™ 不同的是，UltraStar Deluxe 允许用户创建自己的歌曲，并在电脑上演唱。\n我们公开了源代码，让你可以随心所欲地按自己的喜好和需求定制游戏。\n尤其是，你可以随意修改本产品。\n\n你可以创建自己的主题，或下载社区提供的内容，例如插件、免费歌曲或扩展功能的代码补丁。\n在派对模式下，最多可以有十二名玩家一起演唱你喜爱的音乐，并根据音高和演唱节奏获得分数。


