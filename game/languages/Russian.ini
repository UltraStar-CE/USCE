ABOUT_OVERVIEW=UltraStar Deluxe — бесплатная karaoke-игра с открытым исходным кодом для вашего ПК. Игровой процесс похож на коммерческий продукт SingStar™ от Sony Computer Entertainment, который выходит только на Playstation®. Но в отличие от SingStar™, UltraStar Deluxe позволяет пользователям создавать собственные песни и петь их на ПК.\nОпубликовав исходный код, мы дали вам возможность полностью настроить игру под свои вкусы, желания и потребности.\nВ частности, вы вправе изменять продукт как пожелаете.\n\nСоздавайте собственные темы или скачивайте материалы сообщества: плагины, бесплатные песни и патчи с расширенными возможностями.\nВ режиме вечеринки до двенадцати игроков могут петь любимые песни и набирать очки в зависимости от высоты голоса и ритма пения.


