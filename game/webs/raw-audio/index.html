<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>USCE phone audio experiment</title>
<style>
  :root { color-scheme: dark; font: 17px system-ui; background: #111827; color: #eef2ff; }
  body { max-width: 38rem; margin: 3rem auto; padding: 0 1.2rem; }
  label { display: block; margin: 1rem 0; }
  input, button { font: inherit; border-radius: .5rem; padding: .7rem; }
  input { display: block; width: 95%; margin-top: .3rem; }
  button { margin: .3rem .3rem .3rem 0; cursor: pointer; }
  pre { white-space: pre-wrap; background: #1f2937; padding: 1rem; }
</style>
<h1>Phone audio experiment</h1>
<p>One phone supplies player 1's microphone. Audio goes to the game for pitch
detection. This prototype does not record audio or play it through your speakers.</p>
<label>Room code <input id="code" maxlength="4" autocomplete="off"></label>
<label>Test tone frequency (Hz) <input id="frequency" type="number" min="30" max="1200" step="0.1" value="65"></label>
<label><input id="relayOnly" type="checkbox" style="display:inline;width:auto"> Force server route (comparison test)</label>
<details><summary>Connection settings</summary>
<label>Relay WebSocket <input id="relay" value="wss://usdx.at/ws/client"></label>
<label>ICE server <input id="ice" value="stun:stun.l.google.com:19302"></label>
</details>
<button id="mic">Join with microphone</button>
<button id="tone">Join with test tone</button>
<button id="stop" disabled>Stop</button>
<p id="status" role="status">Ready. Start the native audio experiment in USCE first.</p>
<pre id="stats">No connection</pre>
<script type="module" src="phone.js"></script>
</html>
