name: macOS build
on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
      arch:
        type: string
        required: true
      release-version:
        type: string
        default: ''
      use-caches:
        type: boolean
        default: true
env:
  USCE_RELEASE_VERSION: ${{ inputs.release-version }}
  USCE_BUILD_CHANNEL: development
  SDL2_VERSION: 2.32.10
  SDL2_SHA: 5f5993c530f084535c65a6879e9b26ad441169b3e25d789d83287040a9ca5165
  SDL2_IMAGE_VERSION: 2.8.12
  SDL2_IMAGE_SHA: 393f5efb50536ec13ca4f4affb69cc9966d3c3f969e6c5e701faddf9f9785381
  PROJECTM_VERSION: 4.1.7
  PROJECTM_SHA: 16e4610b4d58981f7a2351faa58d507d3f40163a7b26ba81e19aec928c66641f
jobs:
  primary:
    name: macOS 15 attempt (${{ inputs.arch }})
    runs-on: ${{ inputs.arch == 'ARM' && 'macos-15' || 'macos-15-intel' }}
    # The final check enforces the build outcome when CI allows a retry.
    continue-on-error: ${{ inputs.release-version == '' }}
    permissions:
      contents: read
    env:
      USCE_MACOS_RUNNER: ${{ inputs.arch == 'ARM' && 'macos-15' || 'macos-15-intel' }}
    outputs:
      built: ${{ steps.built.outputs.ok }}
    steps: &build_steps
      - name: Checkout Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Determine version
        run: |
          VNAME=$(python3 tools/generate-version.py)
          echo "versionName=$VNAME" >> $GITHUB_ENV
      - name: Bundle reviewed themes
        uses: ./.github/actions/bundle-themes
      - name: Locate Homebrew downloads
        if: inputs.use-caches
        id: homebrew-downloads
        run: |
          echo "path=$(brew --cache)/downloads" >> "$GITHUB_OUTPUT"
          echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
          image="$USCE_MACOS_RUNNER"
          if [[ "$image" == macos-latest ]]; then
            image="$image-$(sw_vers -productVersion | cut -d. -f1)"
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"
      - name: Cache Homebrew downloads
        if: inputs.use-caches
        uses: actions/cache@v6
        with:
          path: ${{ steps.homebrew-downloads.outputs.path }}
          key: homebrew-downloads-v1-${{ steps.homebrew-downloads.outputs.image }}-${{ runner.arch }}-${{ steps.homebrew-downloads.outputs.week }}
          restore-keys: |
            homebrew-downloads-v1-${{ steps.homebrew-downloads.outputs.image }}-${{ runner.arch }}-
      - name: Install Homebrew Dependencies
        run: |
          brew install fpc sdl2-compat sdl2_image automake portaudio lua ffmpeg opencv cmake ninja openssl@3
      - name: Test native library notifications
        run: python3 -m unittest discover -s tools -p "test_library*.py" -v
      - name: Cache ProjectM
        if: inputs.use-caches
        id: cache-projectm
        uses: actions/cache@v6
        with:
          path: ${{github.workspace}}/projectm
          key: projectm-${{ steps.homebrew-downloads.outputs.image }}-${{ env.PROJECTM_VERSION }}
      - name: Build ProjectM
        if: steps.cache-projectm.outputs.cache-hit != 'true'
        run: |
          curl -L -O https://github.com/projectM-visualizer/projectm/releases/download/v$PROJECTM_VERSION/libprojectM-$PROJECTM_VERSION.tar.gz
          echo "$PROJECTM_SHA libprojectM-$PROJECTM_VERSION.tar.gz" | sha256sum -c -
          tar -xf libprojectM-$PROJECTM_VERSION.tar.gz
          cmake -S libprojectM-$PROJECTM_VERSION \
            -B libprojectM-$PROJECTM_VERSION/build \
            -DENABLE_PLAYLIST=OFF \
            -DBUILD_SHARED_LIBS=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/projectm \
            -DCMAKE_INSTALL_NAME_DIR=$GITHUB_WORKSPACE/projectm/lib \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON
          cmake --build libprojectM-$PROJECTM_VERSION/build --target install --parallel
      - name: Stage native phone receiver
        run: |
          export OPENSSL_ROOT_DIR="$(brew --prefix openssl@3)"
          cmake -S native/phone-audio -B build/phone-audio -G Ninja -DCMAKE_BUILD_TYPE=Release -DOPENSSL_USE_STATIC_LIBS=TRUE
          cmake --build build/phone-audio --parallel 3
          ctest --test-dir build/phone-audio --output-on-failure
          license="$(find -L "$OPENSSL_ROOT_DIR" -type f -name LICENSE.txt -print -quit)"
          test -f "$license"
          python3 tools/stage-phone-audio.py --platform darwin --openssl-license "$license"
      - name: Check bundle signing order
        run: python3 tools/test_macos_bundle_signing.py
      - name: Generate Build Scripts
        run: ./autogen.sh
      - name: Configure Project
        run: |
          libprojectM_VERSION=$PROJECTM_VERSION \
          LIBS=-L$GITHUB_WORKSPACE/projectm/lib \
          ./configure --with-opencv-cxx-api --with-libprojectM=nocheck
      - name: Build
        run: make USCE_THEMES_DIR=".release-themes/bundle" macos-dmg
      - name: Rename DMG
        run: mv "UltraStar Community Edition.dmg" "USCE-mac-${{ inputs.arch }}-${{ env.versionName }}.dmg"
      - name: Upload Image Artifact
        uses: actions/upload-artifact@v6
        with:
          name: USCE-mac-${{ inputs.arch }}-${{ env.versionName }}
          path: USCE-mac-${{ inputs.arch }}-${{ env.versionName }}.dmg
          if-no-files-found: error
          retention-days: 7
      - name: Record successful build
        id: built
        run: echo 'ok=true' >> "$GITHUB_OUTPUT"

  inspect:
    name: Check macOS runner startup (${{ inputs.arch }})
    needs: primary
    if: ${{ !cancelled() && inputs.release-version == '' && needs.primary.outputs.built != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      retry: ${{ steps.startup.outputs.result }}
    steps:
      - id: startup
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          PRIMARY_NAME: macOS 15 attempt (${{ inputs.arch }})
        with:
          script: |
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun,
              {...context.repo, run_id: context.runId, filter: 'latest', per_page: 100});
            const name = process.env.PRIMARY_NAME;
            const matches = jobs.filter(job => job.name === name || job.name.endsWith(' / ' + name));
            if (matches.length !== 1) throw Error(`Expected one job named ${name}`);
            const job = matches[0];
            if (job.status !== 'completed' || !Array.isArray(job.steps)) {
              throw Error(`Incomplete startup information for ${name}`);
            }
            const failed = ['failure', 'cancelled', 'startup_failure', 'timed_out'];
            const setup = job.steps.find(step => step.name === 'Set up job');
            const started = job.steps.some(step => step.name !== 'Set up job' &&
              step.name !== 'Complete job' && step.conclusion !== 'skipped');
            // A completed build step, including a failed checkout, rules out startup failure.
            return !started && (setup ? failed.includes(setup.conclusion) :
              job.steps.length === 0 && failed.includes(job.conclusion));

  fallback:
    name: macOS fallback attempt (${{ inputs.arch }})
    needs: inspect
    if: ${{ needs.inspect.outputs.retry == 'true' }}
    runs-on: ${{ inputs.arch == 'ARM' && 'macos-latest' || 'macos-26-intel' }}
    permissions:
      contents: read
    env:
      USCE_MACOS_RUNNER: ${{ inputs.arch == 'ARM' && 'macos-latest' || 'macos-26-intel' }}
    outputs:
      built: ${{ steps.built.outputs.ok }}
    steps: *build_steps

  verify:
    name: Build for MacOS (${{ inputs.arch }})
    needs: [primary, inspect, fallback]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require a successful macOS build
        env:
          PRIMARY_RESULT: ${{ needs.primary.result }}
          PRIMARY_BUILT: ${{ needs.primary.outputs.built }}
          RETRY: ${{ needs.inspect.outputs.retry }}
          FALLBACK_RESULT: ${{ needs.fallback.result }}
          FALLBACK_BUILT: ${{ needs.fallback.outputs.built }}
        run: |
          if [[ "$PRIMARY_RESULT" == success && "$PRIMARY_BUILT" == true ]]; then
            exit 0
          fi
          if [[ "$RETRY" == true && "$FALLBACK_RESULT" == success && "$FALLBACK_BUILT" == true ]]; then
            exit 0
          fi
          echo '::error::Neither macOS attempt completed a successful build.'
          exit 1
