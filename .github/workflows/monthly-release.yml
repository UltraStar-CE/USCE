name: Monthly release preparation
on:
  schedule:
    - cron: '15 7 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    if: github.repository_owner == 'UltraStar-CE'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: usce-pr-publication
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            await require('./tools/monthly-release.cjs').prepareMonthly({github, context, core});
