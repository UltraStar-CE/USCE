name: USCE automation checks
on:
  pull_request:
    paths:
      # ci-automation-paths:start
      - "tools/**"
      - ".github/workflows/**"
      - ".github/actions/**"
      - "!**/*.md"
      - "!**/*.MD"
      - "!**/*.rst"
      - "!**/*.txt"
      # ci-automation-paths:end
permissions:
  contents: read
jobs:
  check:
    name: Check automation boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: node --test tools/*.test.cjs
      - run: node tools/check-ci-workflows.cjs
      - run: python3 tools/check-usce-branding.py
