name: USCE automation checks
on: [pull_request]
permissions:
  contents: read
jobs:
  check:
    name: Check automation boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: node --test tools/usce-automation.test.cjs
