name: Upstream tracking
on:
  schedule:
    - cron: '20 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: upstream-tracking
  cancel-in-progress: false
jobs:
  track:
    concurrency:
      group: usce-pr-publication
      cancel-in-progress: false
      queue: max
    if: vars.USCE_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            await require('./tools/usce-automation.cjs').trackUpstream({github, context, core});
            await require('./tools/upstream-issues.cjs').trackIssues({github, context, core});
            await require('./tools/upstream-forks.cjs').trackForks({github, context, core});
