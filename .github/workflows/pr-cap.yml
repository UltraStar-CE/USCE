name: Open PR limit
on:
  pull_request_target:
    types: [opened, reopened]
permissions: {}
concurrency:
  group: open-pr-limit-${{ github.event.pull_request.user.id }}
  cancel-in-progress: false
jobs:
  enforce:
    if: github.repository_owner == 'UltraStar-CE'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      # No checkout or execution of proposed code. Only public PR metadata is read.
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            function isUpstreamProposal(pr) {
              const repo = pr.base?.repo?.full_name;
              return pr.user?.login === 'github-actions[bot]'
                && ['UltraStar-CE/USCE', 'UltraStar-CE/mxe', 'UltraStar-CE/Themes'].includes(repo)
                && pr.head?.repo?.full_name === repo
                && /^automation\/(?:upstream-(?:usdx|mxe|themes)-|candidate-upstream-|upstream-manual-)[a-f0-9]{12}$/.test(pr.head?.ref || '');
            }
            const owner = 'UltraStar-CE';
            const repos = ['USCE', 'mxe', 'Themes'];
            const limit = 5;
            const number = context.payload.pull_request.number;
            const current = (await github.rest.pulls.get({...context.repo, pull_number: number})).data;
            if (current.state !== 'open' || isUpstreamProposal(current)) return;
            const authorId = current.user.id;
            const open = [];
            for (const repo of repos) {
              const prs = await github.paginate(github.rest.pulls.list,
                {owner, repo, state: 'open', per_page: 100});
              open.push(...prs.filter(pr => pr.user.id === authorId && !isUpstreamProposal(pr))
                .map(pr => ({repo, number: pr.number})));
            }
            // Include the event PR if the list endpoint has not caught up yet.
            if (!open.some(pr => pr.repo === context.repo.repo && pr.number === number)) {
              open.push({repo: context.repo.repo, number});
            }
            if (open.length <= limit) return;
            const body = 'We keep a maximum of 5 open PRs per author across USCE, MXE and Themes, '
              + 'including drafts, maintainer PRs and automated issue candidates. Automated upstream assessments and adaptations are exempt and do not count. '
              + 'This PR exceeds that limit, so we are closing it for now. '
              + 'Its commits and discussion remain available. You can reopen it once '
              + 'merging or closing another PR leaves a free slot. '
              + 'Thank you for helping us keep reviews focused.';
            await github.rest.issues.createComment({...context.repo, issue_number: number, body});
            await github.rest.pulls.update({...context.repo, pull_number: number, state: 'closed'});
