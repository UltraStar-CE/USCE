name: Build
on:
  push:
    branches: [main]
    paths:
      # ci-build-paths:start
      - "src/**"
      - "test/**"
      - "tools/**"
      - ".github/workflows/**"
      - ".github/actions/**"
      - "dists/**"
      - "debian/**"
      - "installer/**"
      - "icons/**"
      - "res/**"
      - "game/plugins/**"
      - "**/*.pas"
      - "**/*.dpr"
      - "**/*.lpr"
      - "**/*.lpi"
      - "**/*.inc"
      - "**/*.c"
      - "**/*.cpp"
      - "**/*.h"
      - "**/*.m"
      - "**/*.mm"
      - "**/*.rc"
      - "**/*.res"
      - "**/*.lua"
      - "**/*.usdx"
      - "**/*.py"
      - "**/*.sh"
      - "**/*.cmake"
      - "**/Makefile*"
      - "configure.ac"
      - "VERSION"
      - ".gitmodules"
      - "!**/*.md"
      - "!**/*.MD"
      - "!**/*.rst"
      - "!**/*.txt"
      - "**/CMakeLists.txt"
      # ci-build-paths:end
  pull_request:
    paths:
      # ci-build-paths:start
      - "src/**"
      - "test/**"
      - "tools/**"
      - ".github/workflows/**"
      - ".github/actions/**"
      - "dists/**"
      - "debian/**"
      - "installer/**"
      - "icons/**"
      - "res/**"
      - "game/plugins/**"
      - "**/*.pas"
      - "**/*.dpr"
      - "**/*.lpr"
      - "**/*.lpi"
      - "**/*.inc"
      - "**/*.c"
      - "**/*.cpp"
      - "**/*.h"
      - "**/*.m"
      - "**/*.mm"
      - "**/*.rc"
      - "**/*.res"
      - "**/*.lua"
      - "**/*.usdx"
      - "**/*.py"
      - "**/*.sh"
      - "**/*.cmake"
      - "**/Makefile*"
      - "configure.ac"
      - "VERSION"
      - ".gitmodules"
      - "!**/*.md"
      - "!**/*.MD"
      - "!**/*.rst"
      - "!**/*.txt"
      - "**/CMakeLists.txt"
      # ci-build-paths:end
permissions:
  contents: read
concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  platforms:
    name: Platforms
    uses: ./.github/workflows/platform-builds.yml
    with:
      ref: ${{ github.sha }}
      use-caches: true
