name: Build

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or full SHA to build (for bot-created candidate PRs)'
        type: string
        default: master
        required: true
  # Run every day at 5:40.
  schedule:
    - cron:  '40 5 * * *'
permissions:
  contents: read
concurrency:
  group: build-${{ github.event.pull_request.number || github.event.inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  resolve:
    name: Resolve build source
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - id: source
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            let sha = context.sha;
            if (context.eventName === 'workflow_dispatch') {
              // Cache write authority follows the dispatch ref, not checkout.
              // Candidate code must never run in the default branch's scope.
              if (context.ref !== 'refs/heads/ci/candidate-validation-runner') {
                throw Error('Dispatch candidate builds from the protected ci/candidate-validation-runner branch');
              }
              const r = await github.rest.repos.getCommit({...context.repo, ref: context.payload.inputs.ref});
              sha = r.data.sha;
            }
            core.setOutput('sha', sha);
  build_windows:
    needs: resolve
    name: ${{ github.event_name == 'workflow_dispatch' && 'Manual - Build for Windows' || 'Build for Windows' }}
    runs-on: windows-2022
    # Adapted from dgruss's USDX PR #1417, commit a4c9ea3e11a8a2c688e7746e8f82e521f950e4a9.
    env:
      FPC_VERSION: 3.2.2
      FPC_SHA256: 8C255390544B051388B577EB61C6191A04883264AFE0E3369B3600A56DAF7BDE
      NSIS_VERSION: 3.05
      NSIS_SHA256: 1A3CC9401667547B9B9327A177B13485F7C59C2303D4B6183E7BC9E6C8D6BFDB
    steps:
      - name: Checkout Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - name: Determine version
        run: |
          $VNAME=$(cat VERSION | sed "s/+dev$/+dev-$(git rev-parse --short HEAD)/")
          echo "versionName=$VNAME" >> $env:GITHUB_ENV
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          update: false
          cache: ${{ github.event_name != 'workflow_dispatch' }}
          install: >-
            autoconf-wrapper
            automake-wrapper
            git
            make
            pkgconf
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-tools
      - name: Cache FPC and NSIS
        if: github.event_name != 'workflow_dispatch'
        id: cache-fpc-nsis
        uses: actions/cache@v6
        with:
          path: |
            C:\FPC\${{ env.FPC_VERSION }}
            C:\Program Files (x86)\NSIS
          key: windows-fpc-nsis-v1-${{ runner.arch }}-fpc-${{ env.FPC_VERSION }}-nsis-${{ env.NSIS_VERSION }}
      - name: Install Dependencies
        if: steps.cache-fpc-nsis.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: |
          curl.exe --fail --location --retry 3 --retry-all-errors --connect-timeout 30 --max-time 300 --output fpc-installer.exe "https://downloads.freepascal.org/fpc/dist/$($env:FPC_VERSION)/i386-win32/fpc-$($env:FPC_VERSION).win32.and.win64.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Compiler download failed; refusing to execute a partial installer' }
          curl.exe --fail --location --retry 3 --retry-all-errors --connect-timeout 30 --max-time 120 --output nsis-installer.exe "https://downloads.sourceforge.net/project/nsis/NSIS%203/$($env:NSIS_VERSION)/nsis-$($env:NSIS_VERSION)-setup.exe"
          if ($LASTEXITCODE -ne 0) { throw 'NSIS download failed; refusing to execute a partial installer' }
          if ((Get-FileHash -Algorithm SHA256 fpc-installer.exe).Hash -ne $env:FPC_SHA256) { throw 'Unexpected FPC installer SHA256' }
          if ((Get-FileHash -Algorithm SHA256 nsis-installer.exe).Hash -ne $env:NSIS_SHA256) { throw 'Unexpected NSIS installer SHA256' }
          $compilerInstaller = Start-Process -FilePath ".\\fpc-installer.exe" -WindowStyle Hidden -ArgumentList "/TYPE=full /VERYSILENT /SP- /SUPPRESSMSGBOXES /NORESTART /LOG=fpc-install.log" -PassThru
          if (-not $compilerInstaller.WaitForExit(600000)) {
            Stop-Process -Id $compilerInstaller.Id -Force
            throw 'Compiler installation exceeded ten minutes'
          }
          if ($compilerInstaller.ExitCode -ne 0) { throw "Compiler installation failed: $($compilerInstaller.ExitCode)" }
          $nsisInstaller = Start-Process -FilePath ".\\nsis-installer.exe" -WindowStyle Hidden -ArgumentList "/S" -PassThru
          if (-not $nsisInstaller.WaitForExit(300000)) {
            Stop-Process -Id $nsisInstaller.Id -Force
            throw 'NSIS installation exceeded five minutes'
          }
          if ($nsisInstaller.ExitCode -ne 0) { throw "NSIS installation failed: $($nsisInstaller.ExitCode)" }
      - name: Download prebuilt DLLs
        run: |
          python dldlls.py
          7z x -y usdx-dlls-x86_64.zip -ogame "*.dll"
          7z x -y usdx-dlls-x86_64.zip -osrc "config-win.inc"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build
        shell: msys2 {0}
        run: |
          export PATH="/usr/bin:/mingw64/bin:/c/FPC/3.2.2/bin:/c/FPC/3.2.2/bin/i386-win32:$PATH"
          export MAKE="/usr/bin/make"
          export FPCCFG="/c/FPC/3.2.2/bin/i386-win32/fpc.cfg"
          export FPCDIR="/c/FPC/3.2.2"
          export FPCMAKE="/c/FPC/3.2.2/bin/i386-win32/fpcmake"
          ./autogen.sh
          ./configure
          make
      - name: Create installer
        run: |
          del game\*.debug
          xcopy game\*.dll installer\dependencies\dll /y
          & 'C:\Program Files (x86)\NSIS\makensis.exe' "installer/UltraStar Community Edition.nsi"
          mv installer\dist\USCE_v*_installer.exe USCE-windows-installer-${{ env.versionName }}.exe
      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v6
        with:
          name: USCE-windows-installer-${{ env.versionName }}
          path: USCE-windows-installer-${{ env.versionName }}.exe
          if-no-files-found: error
      - name: Upload Portable Artifact
        uses: actions/upload-artifact@v6
        with:
          name: USCE-windows-portable-${{ env.versionName }}
          path: game
          if-no-files-found: error

  build_mac:
    needs: resolve
    name: ${{ github.event_name == 'workflow_dispatch' && 'Manual - ' || '' }}Build for MacOS (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel]
    env:
      SDL2_VERSION: 2.32.10
      SDL2_SHA: 5f5993c530f084535c65a6879e9b26ad441169b3e25d789d83287040a9ca5165
      SDL2_IMAGE_VERSION: 2.8.12
      SDL2_IMAGE_SHA: 393f5efb50536ec13ca4f4affb69cc9966d3c3f969e6c5e701faddf9f9785381
      PROJECTM_VERSION: 4.1.7
      PROJECTM_SHA: 16e4610b4d58981f7a2351faa58d507d3f40163a7b26ba81e19aec928c66641f
    steps:
      - name: Checkout Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - name: Determine version
        run: |
          VNAME=$(cat VERSION | sed "s/+dev$/+dev-$(git rev-parse --short HEAD)/")
          echo "versionName=$VNAME" >> $GITHUB_ENV
      - name: Determine Arch
        run: |
          if [ "${{ matrix.os }}" = "macos-15-intel" ]; then
            echo "arch=x86" >> $GITHUB_ENV
          else
            echo "arch=ARM" >> $GITHUB_ENV
          fi
      - name: Install Homebrew Dependencies
        run: |
          brew install fpc sdl2-compat sdl2_image automake portaudio lua ffmpeg opencv
      - name: Cache ProjectM
        if: github.event_name != 'workflow_dispatch'
        id: cache-projectm
        uses: actions/cache@v6
        with:
          path: ${{github.workspace}}/projectm
          key: projectm-${{matrix.os}}-${{env.PROJECTM_VERSION}}
      - name: Build ProjectM
        if: steps.cache-projectm.outputs.cache-hit != 'true'
        run: |
          curl -L -O https://github.com/projectM-visualizer/projectm/releases/download/v$PROJECTM_VERSION/libprojectM-$PROJECTM_VERSION.tar.gz
          echo "$PROJECTM_SHA libprojectM-$PROJECTM_VERSION.tar.gz" | sha256sum -c -
          tar -xf libprojectM-$PROJECTM_VERSION.tar.gz
          cmake -S libprojectM-$PROJECTM_VERSION \
            -B libprojectM-$PROJECTM_VERSION/build \
            -DENABLE_PLAYLIST=OFF \
            -DBUILD_SHARED_LIBS=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/projectm \
            -DCMAKE_INSTALL_NAME_DIR=$GITHUB_WORKSPACE/projectm/lib \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON
          cmake --build libprojectM-$PROJECTM_VERSION/build --target install --parallel
      - name: Generate Build Scripts
        run: ./autogen.sh
      - name: Configure Project
        run: |
          libprojectM_VERSION=$PROJECTM_VERSION \
          LIBS=-L$GITHUB_WORKSPACE/projectm/lib \
          ./configure --with-opencv-cxx-api --with-libprojectM=nocheck
      - name: Build
        run: make macos-dmg
      - name: Rename DMG
        run: mv "UltraStar Community Edition.dmg" "USCE-mac-${{ env.arch }}-${{ env.versionName }}.dmg"
      - name: Upload Image Artifact
        uses: actions/upload-artifact@v6
        with:
          name: USCE-mac-${{ env.arch }}-${{ env.versionName }}
          path: USCE-mac-${{ env.arch }}-${{ env.versionName }}.dmg
          if-no-files-found: error

  build_linux:
    needs: resolve
    name: ${{ github.event_name == 'workflow_dispatch' && 'Manual - Build for Linux' || 'Build for Linux' }}
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - name: Determine version
        run: |
          VNAME=$(cat VERSION | sed "s/+dev$/+dev-$(git rev-parse --short HEAD)/")
          echo "versionName=$VNAME" >> $GITHUB_ENV
      - name: Cache build
        if: github.event_name != 'workflow_dispatch'
        uses: actions/cache@v5
        with:
          key: linux-docker-${{ hashFiles('dists/linux/dl.sh', 'dists/linux/tasks.sh', 'dists/linux/dockerenv.sh', 'dists/linux/Dockerfile.in') }}
          path: |
            dists/linux/prefix
      - name: Start container builder
        uses: docker/setup-buildx-action@v4
      - name: Generate Dockerfile
        run: |
          cd dists/linux
          ./dockerenv.sh --dockerfile > Dockerfile
      - name: Build container
        uses: docker/build-push-action@v7
        with:
          context: dists/linux
          cache-from: ${{ github.event_name != 'workflow_dispatch' && 'type=gha' || '' }}
          cache-to: ${{ github.event_name != 'workflow_dispatch' && 'type=gha,mode=max,ignore-error=true' || '' }}
          load: true
          tags: usce/buildenv:latest
      - name: Build
        run: |
          cd dists/linux
          sed -i '/docker/s/-it\>//' dockerenv.sh
          ./dockerenv.sh --use-existing=usce/buildenv:latest make compress
          mv USCE*.AppImage ../../USCE-linux-${{ env.versionName }}.AppImage
      - name: Upload Image Artifact
        uses: actions/upload-artifact@v6
        with:
          name: USCE-linux-${{ env.versionName }}
          path: USCE-linux-${{ env.versionName }}.AppImage
          if-no-files-found: error

  manual_whitespace:
    name: Manual whitespace check
    if: github.event_name == 'workflow_dispatch'
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Check candidate against the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git -c core.whitespace=blank-at-eol diff --check "origin/$DEFAULT_BRANCH...HEAD" -- './src' ':!./src/lib' ':!./src/webSDK'

  publish_manual_status:
    name: Publish manual candidate build statuses
    if: always() && github.event_name == 'workflow_dispatch' && needs.resolve.result == 'success'
    needs: [resolve, build_windows, build_mac, build_linux, manual_whitespace]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      # This fresh job never checks out or executes candidate code.
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          TARGET_SHA: ${{ needs.resolve.outputs.sha }}
          WINDOWS_RESULT: ${{ needs.build_windows.result }}
          MAC_RESULT: ${{ needs.build_mac.result }}
          LINUX_RESULT: ${{ needs.build_linux.result }}
          LINT_RESULT: ${{ needs.manual_whitespace.result }}
        with:
          script: |
            const target_url = context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId;
            const results = [
              ['Build for Windows', process.env.WINDOWS_RESULT],
              ['Build for Linux', process.env.LINUX_RESULT],
              ['Build for MacOS (macos-latest)', process.env.MAC_RESULT],
              ['Build for MacOS (macos-15-intel)', process.env.MAC_RESULT],
              ['Check trailing whitespace', process.env.LINT_RESULT],
            ];
            for (const [check, result] of results) {
              await github.rest.repos.createCommitStatus({...context.repo, sha: process.env.TARGET_SHA,
                context: check, state: result === 'success' ? 'success' : 'failure',
                description: 'Manual candidate validation: ' + result, target_url});
            }
