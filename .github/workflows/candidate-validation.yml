name: Candidate validation
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Candidate branch or full commit SHA
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: candidate-validation-${{ inputs.ref }}
  cancel-in-progress: false
jobs:
  resolve:
    name: Resolve candidate
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - id: source
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          CANDIDATE_REF: ${{ inputs.ref }}
        with:
          script: |
            if (context.ref !== 'refs/tags/ci-validation-v4') {
              throw Error('Select the protected ci-validation-v4 tag for candidate validation');
            }
            const result = await github.rest.repos.getCommit({...context.repo, ref: process.env.CANDIDATE_REF});
            core.setOutput('sha', result.data.sha);
  platforms:
    name: Candidate platforms
    needs: resolve
    uses: ./.github/workflows/platform-builds.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}
      use-caches: false
  whitespace:
    name: Check candidate whitespace
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Check changes against main
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: git -c core.whitespace=blank-at-eol diff --check --no-ext-diff "origin/$DEFAULT_BRANCH...HEAD" -- . ':!src/lib' ':!src/webSDK'
  publish:
    name: Publish candidate results
    if: always() && needs.resolve.result == 'success'
    needs: [resolve, platforms, whitespace]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      statuses: write
    steps:
      # This job never checks out candidate code.
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          TARGET_SHA: ${{ needs.resolve.outputs.sha }}
          LINT_RESULT: ${{ needs.whitespace.result }}
          PLATFORM_RESULT: ${{ needs.platforms.result }}
        with:
          script: |
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun,
              {...context.repo, run_id: context.runId, filter: 'latest', per_page: 100});
            const names = ['Build for Windows', 'Build for Linux',
              'Build for MacOS (macos-latest)', 'Build for MacOS (macos-15-intel)'];
            const target_url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            let passed = process.env.LINT_RESULT === 'success' && process.env.PLATFORM_RESULT === 'success';
            for (const name of names) {
              const matches = jobs.filter(job => job.name === name || job.name.endsWith(' / ' + name));
              const success = matches.length === 1 && matches[0].conclusion === 'success';
              passed = passed && success;
              await github.rest.repos.createCommitStatus({...context.repo, sha: process.env.TARGET_SHA,
                context: name, state: success ? 'success' : 'failure',
                description: 'Isolated candidate platform validation', target_url});
            }
            // The required gate succeeds only when every platform and whitespace pass.
            await github.rest.repos.createCommitStatus({...context.repo, sha: process.env.TARGET_SHA,
              context: 'Check trailing whitespace', state: passed ? 'success' : 'failure',
              description: 'Candidate whitespace and all platform builds', target_url});
