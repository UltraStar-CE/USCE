name: Platform builds
on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
      release-version:
        type: string
        default: ''
      use-caches:
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  resolve:
    name: Resolve build source
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - id: source
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          BUILD_REF: ${{ inputs.ref }}
          USE_CACHES: ${{ inputs.use-caches }}
          RELEASE_VERSION: ${{ inputs.release-version }}
        with:
          script: |
            let sha = context.sha;
            if (context.eventName === 'workflow_dispatch' && process.env.RELEASE_VERSION) {
              if (context.ref !== 'refs/heads/' + context.payload.repository.default_branch || process.env.BUILD_REF !== context.sha) {
                throw Error('Release builds require the default-branch source revision');
              }
            } else if (context.eventName === 'workflow_dispatch') {
              if (context.ref !== 'refs/tags/ci-validation-v4' || process.env.USE_CACHES !== 'false') {
                throw Error('Candidate builds require the protected ci-validation-v4 tag and disabled caches');
              }
              const result = await github.rest.repos.getCommit({...context.repo, ref: process.env.BUILD_REF});
              sha = result.data.sha;
            } else if (process.env.BUILD_REF !== context.sha) {
              throw Error('Ordinary builds must use the triggering commit');
            }
            core.setOutput('sha', sha);
  build_windows:
    needs: resolve
    name: Build for Windows
    runs-on: windows-2022
    # Adapted from dgruss's USDX PR #1417, commit a4c9ea3e11a8a2c688e7746e8f82e521f950e4a9.
    env:
      USCE_RELEASE_VERSION: ${{ inputs.release-version }}
      USCE_BUILD_CHANNEL: development
      FPC_VERSION: 3.2.2
      FPC_SHA256: 8C255390544B051388B577EB61C6191A04883264AFE0E3369B3600A56DAF7BDE
      NSIS_VERSION: 3.05
      NSIS_SHA256: 1A3CC9401667547B9B9327A177B13485F7C59C2303D4B6183E7BC9E6C8D6BFDB
    steps:
      - name: Use LF source files
        run: git config --global core.autocrlf false
      - name: Checkout Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Determine version
        run: |
          $VNAME=$(python tools/generate-version.py)
          echo "versionName=$VNAME" >> $env:GITHUB_ENV
      - name: Bundle reviewed themes
        uses: ./.github/actions/bundle-themes
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          cache: ${{ inputs.use-caches }}
          install: >-
            base-devel
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-autotools
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-git
            mingw-w64-ucrt-x86_64-ntldd
            mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-python
            patch
            unzip
      - name: Cache FPC and NSIS
        if: inputs.use-caches
        id: cache-fpc-nsis
        uses: actions/cache@v6
        with:
          path: |
            C:\FPC\${{ env.FPC_VERSION }}
            C:\Program Files (x86)\NSIS
          key: windows-fpc-nsis-v1-${{ runner.arch }}-fpc-${{ env.FPC_VERSION }}-nsis-${{ env.NSIS_VERSION }}
      - name: Install Dependencies
        if: steps.cache-fpc-nsis.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: |
          curl.exe --fail --location --retry 3 --retry-all-errors --connect-timeout 30 --max-time 300 --output fpc-installer.exe "https://downloads.freepascal.org/fpc/dist/$($env:FPC_VERSION)/i386-win32/fpc-$($env:FPC_VERSION).win32.and.win64.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Compiler download failed; refusing to execute a partial installer' }
          curl.exe --fail --location --retry 3 --retry-all-errors --connect-timeout 30 --max-time 120 --output nsis-installer.exe "https://downloads.sourceforge.net/project/nsis/NSIS%203/$($env:NSIS_VERSION)/nsis-$($env:NSIS_VERSION)-setup.exe"
          if ($LASTEXITCODE -ne 0) { throw 'NSIS download failed; refusing to execute a partial installer' }
          if ((Get-FileHash -Algorithm SHA256 fpc-installer.exe).Hash -ne $env:FPC_SHA256) { throw 'Unexpected FPC installer SHA256' }
          if ((Get-FileHash -Algorithm SHA256 nsis-installer.exe).Hash -ne $env:NSIS_SHA256) { throw 'Unexpected NSIS installer SHA256' }
          $compilerInstaller = Start-Process -FilePath ".\\fpc-installer.exe" -WindowStyle Hidden -ArgumentList "/TYPE=full /VERYSILENT /SP- /SUPPRESSMSGBOXES /NORESTART /LOG=fpc-install.log" -PassThru
          if (-not $compilerInstaller.WaitForExit(600000)) {
            Stop-Process -Id $compilerInstaller.Id -Force
            throw 'Compiler installation exceeded ten minutes'
          }
          if ($compilerInstaller.ExitCode -ne 0) { throw "Compiler installation failed: $($compilerInstaller.ExitCode)" }
          $nsisInstaller = Start-Process -FilePath ".\\nsis-installer.exe" -WindowStyle Hidden -ArgumentList "/S" -PassThru
          if (-not $nsisInstaller.WaitForExit(300000)) {
            Stop-Process -Id $nsisInstaller.Id -Force
            throw 'NSIS installation exceeded five minutes'
          }
          if ($nsisInstaller.ExitCode -ne 0) { throw "NSIS installation failed: $($nsisInstaller.ExitCode)" }
      - name: Identify Windows dependency build environment
        id: windows-toolchain
        shell: msys2 {0}
        run: |
          set -eo pipefail
          package_key=$(pacman -Q | LC_ALL=C sort | sha256sum)
          echo "key=${package_key%% *}" >> "$GITHUB_OUTPUT"
      - name: Restore Windows DLL dependencies
        if: inputs.use-caches
        id: cache-windows-dlls
        uses: actions/cache/restore@v6
        with:
          path: dists/windows/prefix
          key: windows-2022-ucrt64-native-v2-${{ runner.arch }}-${{ steps.windows-toolchain.outputs.key }}-${{ hashFiles('dists/windows/tasks.sh', 'dists/windows/Makefile', 'dists/windows/*.patch') }}
      - name: Build Windows DLL dependencies
        id: build-windows-dlls
        if: steps.cache-windows-dlls.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: make -C dists/windows
      - name: Save completed Windows DLL dependencies
        if: inputs.use-caches && steps.cache-windows-dlls.outputs.cache-hit != 'true' && steps.build-windows-dlls.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: dists/windows/prefix
          key: ${{ steps.cache-windows-dlls.outputs.cache-primary-key }}
      - name: Install Windows DLL dependencies
        shell: msys2 {0}
        run: |
          # An exact recipe cache hit is newer than the freshly checked-out recipes.
          if [ "${{ steps.cache-windows-dlls.outputs.cache-hit }}" = true ]; then
            touch dists/windows/prefix/$(uname -m)/built_libs
          fi
          make -C dists/windows install
      - name: Build
        shell: msys2 {0}
        run: |
          export PATH="$PATH:/c/FPC/3.2.2/bin/i386-win32"
          export FPCCFG="/c/FPC/3.2.2/bin/i386-win32/fpc.cfg"
          export FPCDIR="/c/FPC/3.2.2"
          export FPCMAKE="/c/FPC/3.2.2/bin/i386-win32/fpcmake"
          ./autogen.sh
          ./configure --with-opencv --with-libprojectM
          make
      - name: Test native library notifications
        env:
          USCE_FPC: C:/FPC/3.2.2/bin/i386-win32/fpc.exe
        run: python -m unittest discover -s tools -p "test_library*.py" -v
      - name: Verify packaged Windows DLL loading without development paths
        run: python tools/check_windows_runtime.py game
      - name: Create installer
        run: |
          del game\*.debug
          xcopy game\*.dll installer\dependencies\dll /y
          & 'C:\Program Files (x86)\NSIS\makensis.exe' "/DUSCE_THEMES_DIR=$((Resolve-Path .release-themes/bundle).Path)" "installer/UltraStar Community Edition.nsi"
          mv installer\dist\USCE_v*_installer.exe USCE-windows-installer-${{ env.versionName }}.exe
      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v6
        with:
          name: USCE-windows-installer-${{ env.versionName }}
          path: USCE-windows-installer-${{ env.versionName }}.exe
          if-no-files-found: error
          retention-days: 7
      - name: Stage portable package with every theme
        run: python tools/bundle-themes.py portable --source game --destination .release-themes/portable
      - name: Upload Portable Artifact
        uses: actions/upload-artifact@v6
        with:
          name: USCE-windows-portable-${{ env.versionName }}
          path: .release-themes/portable
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  build_mac:
    needs: resolve
    name: Build for MacOS (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    env:
      USCE_RELEASE_VERSION: ${{ inputs.release-version }}
      USCE_BUILD_CHANNEL: development
      SDL2_VERSION: 2.32.10
      SDL2_SHA: 5f5993c530f084535c65a6879e9b26ad441169b3e25d789d83287040a9ca5165
      SDL2_IMAGE_VERSION: 2.8.12
      SDL2_IMAGE_SHA: 393f5efb50536ec13ca4f4affb69cc9966d3c3f969e6c5e701faddf9f9785381
      PROJECTM_VERSION: 4.1.7
      PROJECTM_SHA: 16e4610b4d58981f7a2351faa58d507d3f40163a7b26ba81e19aec928c66641f
    steps:
      - name: Checkout Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Determine version
        run: |
          VNAME=$(python3 tools/generate-version.py)
          echo "versionName=$VNAME" >> $GITHUB_ENV
      - name: Bundle reviewed themes
        uses: ./.github/actions/bundle-themes
      - name: Determine Arch
        run: |
          if [ "${{ matrix.os }}" = "macos-15-intel" ]; then
            echo "arch=x86" >> $GITHUB_ENV
          else
            echo "arch=ARM" >> $GITHUB_ENV
          fi
      - name: Locate Homebrew downloads
        if: inputs.use-caches
        id: homebrew-downloads
        run: |
          echo "path=$(brew --cache)/downloads" >> "$GITHUB_OUTPUT"
          echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: Cache Homebrew downloads
        if: inputs.use-caches
        uses: actions/cache@v6
        with:
          path: ${{ steps.homebrew-downloads.outputs.path }}
          key: homebrew-downloads-v1-${{ matrix.os }}-${{ runner.arch }}-${{ steps.homebrew-downloads.outputs.week }}
          restore-keys: |
            homebrew-downloads-v1-${{ matrix.os }}-${{ runner.arch }}-
      - name: Install Homebrew Dependencies
        run: |
          brew install fpc sdl2-compat sdl2_image automake portaudio lua ffmpeg opencv
      - name: Test native library notifications
        run: python3 -m unittest discover -s tools -p "test_library*.py" -v
      - name: Cache ProjectM
        if: inputs.use-caches
        id: cache-projectm
        uses: actions/cache@v6
        with:
          path: ${{github.workspace}}/projectm
          key: projectm-${{matrix.os}}-${{env.PROJECTM_VERSION}}
      - name: Build ProjectM
        if: steps.cache-projectm.outputs.cache-hit != 'true'
        run: |
          curl -L -O https://github.com/projectM-visualizer/projectm/releases/download/v$PROJECTM_VERSION/libprojectM-$PROJECTM_VERSION.tar.gz
          echo "$PROJECTM_SHA libprojectM-$PROJECTM_VERSION.tar.gz" | sha256sum -c -
          tar -xf libprojectM-$PROJECTM_VERSION.tar.gz
          cmake -S libprojectM-$PROJECTM_VERSION \
            -B libprojectM-$PROJECTM_VERSION/build \
            -DENABLE_PLAYLIST=OFF \
            -DBUILD_SHARED_LIBS=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/projectm \
            -DCMAKE_INSTALL_NAME_DIR=$GITHUB_WORKSPACE/projectm/lib \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON
          cmake --build libprojectM-$PROJECTM_VERSION/build --target install --parallel
      - name: Generate Build Scripts
        run: ./autogen.sh
      - name: Configure Project
        run: |
          libprojectM_VERSION=$PROJECTM_VERSION \
          LIBS=-L$GITHUB_WORKSPACE/projectm/lib \
          ./configure --with-opencv-cxx-api --with-libprojectM=nocheck
      - name: Build
        run: make USCE_THEMES_DIR=".release-themes/bundle" macos-dmg
      - name: Rename DMG
        run: mv "UltraStar Community Edition.dmg" "USCE-mac-${{ env.arch }}-${{ env.versionName }}.dmg"
      - name: Upload Image Artifact
        uses: actions/upload-artifact@v6
        with:
          name: USCE-mac-${{ env.arch }}-${{ env.versionName }}
          path: USCE-mac-${{ env.arch }}-${{ env.versionName }}.dmg
          if-no-files-found: error
          retention-days: 7

  build_linux:
    env:
      USCE_RELEASE_VERSION: ${{ inputs.release-version }}
      USCE_BUILD_CHANNEL: development
      USCE_DOCKER_TTY: ''
    needs: resolve
    name: Build for Linux
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Determine version
        run: |
          VNAME=$(python3 tools/generate-version.py)
          echo "versionName=$VNAME" >> $GITHUB_ENV
      - name: Bundle reviewed themes
        uses: ./.github/actions/bundle-themes
      - name: Cache build
        if: inputs.use-caches
        uses: actions/cache@v5
        with:
          key: linux-docker-${{ hashFiles('dists/linux/dl.sh', 'dists/linux/tasks.sh', 'dists/linux/dockerenv.sh', 'dists/linux/Dockerfile.in') }}
          path: |
            dists/linux/prefix
      - name: Start container builder
        uses: docker/setup-buildx-action@v4
      - name: Generate Dockerfile
        run: |
          cd dists/linux
          ./dockerenv.sh --dockerfile > Dockerfile
      - name: Build container
        uses: docker/build-push-action@v7
        with:
          context: dists/linux
          cache-from: ${{ inputs.use-caches && 'type=gha' || '' }}
          cache-to: ${{ inputs.use-caches && 'type=gha,mode=max,ignore-error=true' || '' }}
          load: true
          tags: usce/buildenv:latest
      - name: Build
        run: |
          cd dists/linux
          ./dockerenv.sh --use-existing=usce/buildenv:latest env USCE_THEMES_DIR=/src/.release-themes/bundle make compress
          ./dockerenv.sh --use-existing=usce/buildenv:latest python3 -m unittest discover -s tools -p 'test_library*.py' -v
          mv USCE*.AppImage ../../USCE-linux-${{ env.versionName }}.AppImage
      - name: Upload Image Artifact
        uses: actions/upload-artifact@v6
        with:
          name: USCE-linux-${{ env.versionName }}
          path: USCE-linux-${{ env.versionName }}.AppImage
          if-no-files-found: error
          retention-days: 7
