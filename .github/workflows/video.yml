name: Video backends

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "test/**"
      - "configure.ac"
      - "autogen.sh"
      - "Makefile.in"
      - "dists/autogen/**"
      - ".github/workflows/video.yml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "src/**"
      - "test/**"
      - "configure.ac"
      - "autogen.sh"
      - "Makefile.in"
      - "dists/autogen/**"
      - ".github/workflows/video.yml"

permissions:
  contents: read

jobs:
  build_linux:
    name: Linux (${{ matrix.mpv }} libmpv)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mpv: [with, without]
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            autoconf automake make gcc fpc pkg-config \
            libsdl2-dev libsdl2-image-dev libfreetype6-dev libsqlite3-dev \
            libavformat-dev libavcodec-dev libavutil-dev libswresample-dev libswscale-dev \
            portaudio19-dev libportmidi-dev liblua5.3-dev \
            python3 ffmpeg xvfb xauth libgl1 libegl1 libgles2 \
            libgl1-mesa-dri libglx-mesa0 libegl-mesa0
      - name: Install libmpv
        if: matrix.mpv == 'with'
        run: sudo apt-get install --no-install-recommends -y libmpv-dev
      - name: Configure
        run: |
          ./autogen.sh
          ./configure --enable-debug --without-opencv --${{ matrix.mpv }}-mpv
      - name: Build
        run: make
      - name: Test video clock synchronization
        run: |
          mkdir -p build/video-tests
          fpc -Fusrc/media -FUbuild/video-tests -FEbuild/video-tests test/VideoSyncTest.pas
          build/video-tests/VideoSyncTest
      - name: Test rendering and video playback
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          SDL_VIDEODRIVER: x11
        run: |
          xvfb-run -a -s '-screen 0 1280x720x24' \
            python3 test/run-video-smoke.py --output-dir build/video-smoke --renderers gl gl2 gles2 gles3
      - name: Test hardware decoding option with software fallback
        if: matrix.mpv == 'with'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          SDL_VIDEODRIVER: x11
        run: |
          xvfb-run -a -s '-screen 0 1280x720x24' \
            python3 test/run-video-smoke.py --prebuilt build/video-smoke/VideoSmoke \
              --fixture build/video-smoke/quadrants.mp4 --renderers gl --hwdec auto
      - name: Test enabled build without the runtime library
        if: matrix.mpv == 'with'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          SDL_VIDEODRIVER: x11
        run: |
          sudo apt-get remove -y libmpv-dev libmpv2
          xvfb-run -a -s '-screen 0 1280x720x24' \
            python3 test/run-video-smoke.py --prebuilt build/video-smoke/VideoSmoke \
              --fixture build/video-smoke/quadrants.mp4 --renderers gl gl2 gles2 gles3 \
              --expect-missing-mpv
