name: Release candidate
on:
  push:
    branches: [main]
    paths: [release-plan.json]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-candidate
  cancel-in-progress: false
  queue: max
jobs:
  plan:
    if: github.repository_owner == 'UltraStar-CE' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - id: plan
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            await require('./tools/publish-release.cjs').planRelease({github, context, core});
  build:
    needs: plan
    if: needs.plan.outputs.version != ''
    uses: ./.github/workflows/platform-builds.yml
    with:
      ref: ${{ github.sha }}
      release-version: ${{ needs.plan.outputs.version }}
  draft:
    needs: [plan, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: release-artifacts
          pattern: USCE-*
      - name: Package release downloads
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: python3 tools/package-release.py release-artifacts release-output "$RELEASE_VERSION"
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        with:
          script: |
            await require('./tools/publish-release.cjs').publishDraft({github, context, core}, process.env.RELEASE_VERSION);
