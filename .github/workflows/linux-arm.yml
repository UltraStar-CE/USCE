name: Experimental Linux ARM build
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: linux-arm-${{ github.ref }}
  cancel-in-progress: true
jobs:
  arm64:
    name: Build for Linux ARM64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install packaged build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential automake autoconf libtool pkg-config \
            fp-compiler fp-units-fcl fp-units-gfx fp-units-multimedia \
            libsdl2-dev libsdl2-image-dev libavcodec-dev libavformat-dev \
            libavutil-dev libswresample-dev libswscale-dev \
            libsqlite3-dev libfreetype6-dev liblua5.4-dev libportaudio2 \
            portaudio19-dev libasound2-dev libgl1-mesa-dev
      - name: Configure and build
        run: |
          ./autogen.sh
          ./configure --prefix=/usr --without-opencv
          make -j2
      - name: Stage portable installation tree
        run: |
          make install DESTDIR="$PWD/arm64-package"
          tar -C arm64-package -czf USCE-linux-arm64.tar.gz .
      - name: Upload ARM64 installation tree
        uses: actions/upload-artifact@v6
        with:
          name: USCE-linux-arm64
          path: USCE-linux-arm64.tar.gz
          if-no-files-found: error
          retention-days: 7
