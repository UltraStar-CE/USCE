name: Bundle USCE themes
description: Stage every theme and its assets from the reviewed Themes commit
runs:
  using: composite
  steps:
    - id: pin
      shell: bash
      run: |
        if [ "$RUNNER_OS" = Windows ]; then py=python; else py=python3; fi
        "$py" tools/bundle-themes.py pin >> "$GITHUB_OUTPUT"
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        repository: UltraStar-CE/Themes
        ref: ${{ steps.pin.outputs.sha }}
        path: .release-themes/source
        fetch-depth: 1
        persist-credentials: false
    - shell: bash
      run: |
        if [ "$RUNNER_OS" = Windows ]; then py=python; else py=python3; fi
        "$py" tools/bundle-themes.py bundle
        "$py" tools/check_english.py --themes .release-themes/source
