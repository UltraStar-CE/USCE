<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-labelledby="title desc">
  <title id="title">USCE 2026.10.0 to USCE 2026.11.0</title>
  <desc id="desc">Phone microphones. Up to 12 phone inputs with optional remote controls. Continuous playback. Sing the next song or play lyrics with zero singers. Live song library. Song files can change while the game is open. Editor playback. Navigate notes live and choose waveform tones</desc>
